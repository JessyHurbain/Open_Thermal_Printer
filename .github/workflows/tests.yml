name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.10 est le Python de Linux Mint 21/22, 3.12 celui des machines plus récentes.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Bibliothèques Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libfontconfig1 libxkbcommon-x11-0 libxcb-cursor0 \
            fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Suite complète, sans écran
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./tester.sh
