<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Open Thermal Printer</title>
  <!-- Tuile : garde l'icône lisible sur un fond clair comme sur un fond sombre. -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#1f2a37"/>

  <!-- Étiquette qui sort par le haut : texte + code-barres stylisé. -->
