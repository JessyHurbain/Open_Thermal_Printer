  <rect x="166" y="118" width="180" height="15" rx="7" fill="#94a3b8"/>
  <rect x="166" y="148" width="120" height="15" rx="7" fill="#94a3b8"/>
  <g fill="#0f172a">
    <rect x="166" y="186" width="9" height="44"/>
    <rect x="181" y="186" width="5" height="44"/>
    <rect x="192" y="186" width="13" height="44"/>
    <rect x="211" y="186" width="5" height="44"/>
    <rect x="222" y="186" width="9" height="44"/>
    <rect x="237" y="186" width="17" height="44"/>
    <rect x="260" y="186" width="5" height="44"/>
    <rect x="271" y="186" width="11" height="44"/>
    <rect x="288" y="186" width="5" height="44"/>
    <rect x="299" y="186" width="13" height="44"/>
    <rect x="318" y="186" width="9" height="44"/>
    <rect x="333" y="186" width="13" height="44"/>
  </g>

