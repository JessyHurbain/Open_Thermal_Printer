  <rect x="128" y="262" width="256" height="22" rx="11" fill="#0f172a"/>
  <rect x="128" y="306" width="256" height="96" rx="16" fill="#e2e8f0"/>
  <circle cx="372" cy="272" r="11" fill="#22c55e"/>
  <rect x="128" y="336" width="168" height="14" rx="7" fill="#64748b"/>
  <rect x="128" y="362" width="104" height="14" rx="7" fill="#94a3b8"/>
  <rect x="126" y="424" width="52" height="18" rx="9" fill="#94a3b8"/>
  <rect x="334" y="424" width="52" height="18" rx="9" fill="#94a3b8"/>
</svg>
